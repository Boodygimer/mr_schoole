{% extends 'base.html' %}

{% block title %}Watch Lesson - Boody Gimer - Edu Platform{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="video-box position-relative w-75" style="max-width: 1200px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.7); border: 1px solid rgba(30,91,190,0.2);">
        <video controls controlsList="nodownload" id="vid" class="w-100">
            <source src="{{ video.url }}">
        </video>
        <div class="watermark position-absolute" style="top: 10%; left: 8%; font-size: 18px; color: rgba(30,91,190,0.15); pointer-events: none; font-weight: 600;">
            {{ current_user.name }} - {{ current_user.id }}
        </div>
    </div>
    <a href="/" class="btn btn-secondary mt-3">العودة</a>
</div>

<div id="alert-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 99; text-align: center; padding-top: 15%; color: #EF4444; backdrop-filter: blur(4px);">
    <h1>⛔ ممنوع التصوير!</h1>
    <p>تم تسجيل المخالفة: {{ current_user.name }}</p>
</div>

<script>
    window.addEventListener('keyup', (e) => { if(e.key == 'PrintScreen') punish(); });
    function punish() {
        document.getElementById('vid').pause();
        document.getElementById('alert-overlay').style.display = 'block';
        setTimeout(() => { document.getElementById('alert-overlay').style.display = 'none'; }, 4000);
    }
</script>
{% endblock %}
