<!DOCTYPE html>
<!-- Login page: simple research-oriented professional styling -->
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      /* Professional Color System:
         Primary: #0B3D91 (academic navy) | Light: #1E5BBE | Dark: #071E4A
         BG: #F8FAFB (near-white) | Text: #0B1621 (dark neutral)
         Support: Green #10B981, Orange #F59E0B, Red #EF4444
      */
      body { background: linear-gradient(135deg, #F8FAFB 0%, #F0F4F9 100%); color: #0B1621; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .card-surface { background: #FFFFFF; border-radius: 12px; box-shadow: 0 10px 30px rgba(11,26,43,0.08); border: 1px solid rgba(11,61,145,0.05); }
      .brand-btn { background-color: #0B3D91; border: none; transition: all 0.24s; }
      .brand-btn:hover { background-color: #1E5BBE; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,91,190,0.25); }
      a.text-info { color: #1E5BBE; text-decoration: none; }
      a.text-info:hover { color: #0B3D91; }
    </style>
</head>
<body>
    <div class="p-4 card-surface" style="width: 420px;">
        <h3 class="text-center mb-4">تسجيل الدخول — بحث علمي</h3>
        <form method="POST">
            <input type="email" name="email" class="form-control mb-3" placeholder="البريد الإلكتروني" required>
            <input type="password" name="password" class="form-control mb-4" placeholder="كلمة المرور" required>
            <button class="btn brand-btn text-white w-100 mb-3">دخول</button>
            <div class="text-center"><a href="/register" class="text-info">إنشاء حساب جديد</a></div>
        </form>
    </div>
</body>
</html>
