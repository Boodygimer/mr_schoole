{% extends 'base.html' %}

{% block title %}Verify OTP - Boody Gimer - Edu Platform{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="p-4 bg-dark text-light rounded shadow" style="width: 420px; border: 1px solid #414868;">
        <h3 class="text-center mb-4">تأكيد الهوية</h3>

        <p class="text-center text-muted">
            تم إرسال رمز التحقق إلى بريدك الإلكتروني.
        </p>

        <form method="POST">
            <div class="mb-3">
                <label for="otp" class="form-label">رمز التحقق (6 أرقام)</label>
                <input
                    type="text"
                    class="form-control bg-secondary text-light border-0"
                    id="otp"
                    name="otp"
                    required
                    maxlength="6"
                    pattern="\d{6}"
                    placeholder="------"
                    style="text-align: center; letter-spacing: 5px; font-size: 1.2rem;" />
            </div>
            <button class="btn btn-primary w-100">تأكيد</button>
        </form>
    </div>
</div>
{% endblock %}
        <button type="submit" class="btn btn-primary w-100">
          تأكيد وانشاء الحساب
        </button>
      </form>
    </div>
  </body>
</html>
