<!doctype html>
<!-- OTP verification page: secure account creation step -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تأكيد الهوية</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <style>
      body { background: linear-gradient(135deg, #F8FAFB 0%, #EEF2F9 100%); display:flex; align-items:center; justify-content:center; height:100vh; font-family:"Cairo", -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0B1621 }
      .card { border:1px solid #E5EAEF; border-radius:12px; box-shadow:0 10px 30px rgba(11,26,43,0.08); max-width:420px; width:100%; background: #FFFFFF }
      .btn-primary { background:#0B3D91; border:none; transition: all 0.24s }
      .btn-primary:hover { background:#1E5BBE; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,91,190,0.25) }
      input.form-control { border: 1px solid #D5DDE5 }
      input.form-control:focus { border-color: #1E5BBE; box-shadow: 0 0 0 3px rgba(30,91,190,0.1) }
    </style>
  </head>
  <body>
    <div class="card p-4">
      <h3 class="text-center mb-4">تأكيد الهوية</h3>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <p class="text-center text-muted">
        تم إرسال رمز التحقق إلى بريدك الإلكتروني.
      </p>

      <form method="POST">
        <div class="mb-3">
          <label for="otp" class="form-label">رمز التحقق (6 أرقام)</label>
          <input
            type="text"
            class="form-control"
            id="otp"
            name="otp"
            required
            maxlength="6"
            pattern="\d{6}"
            placeholder="------"
            style="
              text-align: center;
              letter-spacing: 5px;
              font-size: 1.2rem;
            " />
        </div>
        <button type="submit" class="btn btn-primary w-100">
          تأكيد وانشاء الحساب
        </button>
      </form>
    </div>
  </body>
</html>
