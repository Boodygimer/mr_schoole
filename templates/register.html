{% extends 'base.html' %}

{% block title %}Register - Boody Gimer - Edu Platform{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="p-4 bg-dark text-light rounded shadow" style="width: 420px; border: 1px solid #414868;">
        <h3 class="text-center mb-4">إنشاء حساب</h3>
        <form method="POST">
            <input type="text" name="name" class="form-control mb-3 bg-secondary text-light border-0" placeholder="الاسم (Nickname)" required>
            <input type="email" name="email" class="form-control mb-3 bg-secondary text-light border-0" placeholder="البريد الإلكتروني" required>
            <input type="tel" name="phone_number" class="form-control mb-3 bg-secondary text-light border-0" placeholder="رقم الهاتف (201xxxxxxxxx)" pattern="^201\d{9}$" title="يجب أن يبدأ بـ 201 ويتكون من 12 رقم" required>
            <input type="tel" name="parent_phone_number" class="form-control mb-3 bg-secondary text-light border-0" placeholder="رقم ولي الأمر (201xxxxxxxxx)" pattern="^201\d{9}$" title="يجب أن يبدأ بـ 201 ويتكون من 12 رقم" required>
            <input type="password" name="password" class="form-control mb-4 bg-secondary text-light border-0" placeholder="كلمة المرور" required>
            <button class="btn btn-primary w-100 mb-3">تسجيل</button>
            <div class="text-center">
                <a href="/login" class="text-info">لديك حساب بالفعل؟</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
  </body>
</html>
